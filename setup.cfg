# All configuration for plugins and other utils is defined here.
# Read more about `setup.cfg`:
# https://docs.python.org/3.11/distutils/configfile.html


[flake8]
# flake8 configuration:
# https://flake8.pycqa.org/en/latest/user/configuration.html
format = wemake
show-source = true
statistics = false
doctests = true
allowed-module-metadata = __all__

# Flake plugins:
max-line-length = 80
max-complexity = 6

extend-exclude = .venv

# We only run wemake-python-styleguide and system checks:
select = WPS, E99, FIN

# Docs: https://github.com/snoack/flake8-per-file-ignores
# You can completely or partially disable our custom checks,
# to do so you have to ignore `WPS` letters for all python files:
per-file-ignores =
  src/server/implemented.py: WPS202, WPS213, WPS235
  src/server/settings/*.py: WPS226, WPS407, WPS412, WPS432
  src/server/*/migrations/*.py: WPS102, WPS432, WPS221, FIN
  src/server/urls.py: WPS201
  src/server/apps/*/models.py: WPS110, WPS115, WPS601, FIN, WPS431
  src/server/apps/*/exceptions.py: FIN

  # TODO #217:15min Refactor and remove `WPS201`
  tests/*.py: WPS432, WPS226, WPS201, WPS202
  # TODO #217:15min Refactor and remove `WPS201` and `WPS202`
  src/server/apps/auth/views.py: WPS201, WPS202

  src/server/apps/*/views.py: WPS201
  src/server/apps/*/__init__.py:WPS412
