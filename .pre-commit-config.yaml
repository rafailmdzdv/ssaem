repos:
  - repo: local
    hooks:
      - id: flake8
        name: flake8
        entry: flake8
        language: python
        types: [python]

  # Django Migrations Linter
  - repo: local
    hooks:
      - id: pre-commit-django-migration-lint
        name: Lint Django migrations
        entry: ./src/manage.py lintmigrations
        language: system
        pass_filenames: false

  # Pytest
  - repo: local
    hooks:
      - id: pytest-check
        name: pytest-check
        entry: pytest
        language: system
        pass_filenames: false
        always_run: true
